// Starter gameplay defaults. server.cfg can override gameplay below.
hostname "{{HOSTNAME}}"
sm_cvar mp_gamemode "coop"
z_difficulty "Easy"
sm_cvar z_non_head_damage_factor_easy 1
sm_cvar z_common_limit 18
sm_cvar z_mob_spawn_min_size 6
sm_cvar z_mob_spawn_max_size 18
sm_cvar z_mega_mob_size 30
sm_cvar z_mob_spawn_min_interval_easy 120
sm_cvar z_mob_spawn_max_interval_easy 240
sm_cvar z_mob_spawn_min_interval_normal 120
sm_cvar z_mob_spawn_max_interval_normal 240
exec sourcemod/acs.cfg
exec server.cfg
// These guards always stay local and unauthenticated remote control stays disabled.
sv_lan 1
sv_allow_lobby_connect_only 0
rcon_password ""
sv_cheats 0
meta list
sm plugins list
status
echo L4D2_LAN_KIT_CONFIG_READY
